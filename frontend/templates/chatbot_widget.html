{% extends "base.html" %}
{% block title %}Chat - AvaMJ{% endblock %}

{% block content %}
<h1 class="h2 fw-bold mb-4">Professor Virtual</h1>

<div class="card shadow-sm mx-auto" style="max-width: 42rem;">
    <div id="chat-messages" class="card-body overflow-auto border-bottom" style="height: 24rem;">
        <p class="text-muted small mb-0">Envie uma mensagem para o Professor Virtual.</p>
    </div>
    <div class="card-footer">
        <div class="input-group">
            <input type="text" id="chat-input" class="form-control" placeholder="Sua mensagem...">
            <button id="chat-send" class="btn btn-primary">Enviar</button>
        </div>
    </div>
</div>

<p class="mt-3 text-muted small">Rota: POST /api/chatbot/message</p>
{% endblock %}

{% block scripts %}
<script>
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');
    const userId = 1; // em produção: vir da sessão LTI

    function appendMessage(text, isUser) {
        const p = document.createElement('p');
        p.className = isUser ? 'text-end text-primary mb-1' : 'text-start text-body mb-1';
        p.textContent = (isUser ? 'Você: ' : 'Professor: ') + text;
        messagesEl.appendChild(p);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    sendBtn.addEventListener('click', async () => {
        const message = inputEl.value.trim();
        if (!message) return;
        appendMessage(message, true);
        inputEl.value = '';
        try {
            const res = await fetch('/api/chatbot/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, message })
            });
            const data = await res.json();
            appendMessage(data.reply || 'Sem resposta.', false);
        } catch (e) {
            appendMessage('Erro ao enviar.', false);
        }
    });
</script>
{% endblock %}
