{% extends "base.html" %}
{% block title %}Dashboard - AvaMJ{% endblock %}

{% block content %}
<h1 class="h2 fw-bold mb-4">Dashboard do Aluno</h1>

<div class="row g-4">
    <div class="col-12 col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title h6 fw-semibold mb-3">Notas</h2>
                <canvas id="grades-chart" height="200"></canvas>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title h6 fw-semibold mb-3">Frequência / Evolução</h2>
                <canvas id="frequency-chart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm mt-4">
    <div class="card-body">
        <h2 class="card-title h6 fw-semibold mb-3">Resumo</h2>
        <p class="card-text text-muted mb-0">Média, tendência e projeção IDEB (dados do backend).</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/charts.js"></script>
{% endblock %}
